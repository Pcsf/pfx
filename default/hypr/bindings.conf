# pfx default keybindings.
#
# SYSTEM FILE — replaced on every update. To change or add a binding, edit
# ~/.config/hypr/bindings.conf instead; it is sourced after this file, so it
# wins. To replace a binding defined here, `unbind` it first.
#
# `bindd` takes a description as its third argument, which is what makes the
# SUPER+K keybinding list readable.

# --- Applications ---
bindd = SUPER, RETURN, Terminal, exec, pfx-launch-terminal
bindd = SUPER SHIFT, RETURN, Browser, exec, pfx-launch-browser
bindd = SUPER, E, Files, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, N, Editor, exec, pfx-launch-editor

# --- Menus ---
bindd = SUPER, SPACE, Launch apps, exec, pfx-launch-walker
bindd = SUPER ALT, SPACE, pfx menu, exec, pfx-menu
bindd = SUPER, K, Show keybindings, exec, pfx-menu-keybindings
bindd = SUPER CTRL, V, Clipboard history, exec, cliphist list | pfx-launch-walker --dmenu | cliphist decode | wl-copy
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, pfx-menu style

# --- Window management ---
bindd = SUPER, W, Close window, killactive
bindd = SUPER, F, Full screen, fullscreen
bindd = SUPER, T, Toggle floating, togglefloating
bindd = SUPER, J, Toggle split, layoutmsg, togglesplit
bindd = SUPER, P, Pseudo tile, pseudo

bindd = SUPER, left, Focus left, movefocus, l
bindd = SUPER, right, Focus right, movefocus, r
bindd = SUPER, up, Focus up, movefocus, u
bindd = SUPER, down, Focus down, movefocus, d

bindd = SUPER SHIFT, left, Move window left, movewindow, l
bindd = SUPER SHIFT, right, Move window right, movewindow, r
bindd = SUPER SHIFT, up, Move window up, movewindow, u
bindd = SUPER SHIFT, down, Move window down, movewindow, d

bindd = SUPER CTRL, left, Shrink window, resizeactive, -80 0
bindd = SUPER CTRL, right, Expand window, resizeactive, 80 0
bindd = SUPER CTRL, up, Shrink window vertically, resizeactive, 0 -80
bindd = SUPER CTRL, down, Expand window vertically, resizeactive, 0 80

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# --- Workspaces ---
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = SUPER SHIFT, S, Move to scratchpad, movetoworkspace, special:magic

# --- Capture ---
bindd = , PRINT, Screenshot region, exec, pfx-capture-screenshot region
bindd = SHIFT, PRINT, Screenshot window, exec, pfx-capture-screenshot window
bindd = CTRL, PRINT, Screenshot screen, exec, pfx-capture-screenshot output
bindd = ALT, PRINT, Toggle screen recording, exec, pfx-capture-screenrecord
bindd = SUPER, PRINT, Colour picker, exec, hyprpicker -a

# --- Style ---
bindd = SUPER CTRL, T, Next theme, exec, pfx-theme-next
bindd = SUPER CTRL, W, Next wallpaper, exec, pfx-theme-bg-next

# --- Session ---
bindd = SUPER CTRL, L, Lock session, exec, loginctl lock-session
bindd = SUPER, ESCAPE, System menu, exec, pfx-menu system
bindd = SUPER SHIFT ALT, Q, Exit Hyprland, exit

# --- Media and hardware keys ---
bindeld = , XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise
bindeld = , XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower
bindld = , XF86AudioMute, Mute, exec, swayosd-client --output-volume mute-toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise
bindeld = , XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
