# pfx default appearance.
#
# SYSTEM FILE — replaced on every update. Override in ~/.config/hypr/looknfeel.conf.
# Colours come from the active theme, which is sourced separately.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 3
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.1
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1

    animation = windows, 1, 4, easeOutQuint, popin 87%
    animation = windowsOut, 1, 3, easeOutQuint, popin 87%
    animation = fade, 1, 4, easeOutQuint
    animation = workspaces, 1, 4, easeOutQuint, slide
    animation = layers, 1, 3, easeOutQuint, fade
    animation = border, 1, 6, easeOutQuint
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
