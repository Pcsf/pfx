# pfx default window rules.
#
# SYSTEM FILE — replaced on every update.
#
# Hyprland 0.53+ rule syntax: `windowrule = <rule>, match:<field> <regex>`.
# This changed from the older `windowrule = <rule>, class:^(...)$` form and
# changes again periodically — verify any edit with:
#
#   Hyprland --verify-config -c ~/.config/hypr/hyprland.conf
#
# Tags are the idiom worth knowing: tag a set of windows once, then write the
# rules against the tag. It keeps the regexes in one place.

# --- Small transient system windows float, centred ---
windowrule = tag +floating-window, match:class (pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)
windowrule = tag +floating-window, match:class (pfx-task|pfx-tui)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to (open|save).*|[Cc]hoose.*)

windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 900 620, match:tag floating-window

# --- Picture-in-picture floats, pinned, out of the way ---
windowrule = tag +pip, match:title (Picture.?in.?[Pp]icture)
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
windowrule = size 600 338, match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = move (monitor_w-window_w-40) (monitor_h*0.04), match:tag pip

# --- Never sleep the screen during fullscreen video ---
windowrule = idle_inhibit fullscreen, match:class .*

# --- Overlays should not animate; it reads as lag on a menu ---
layerrule = no_anim on, match:namespace walker
layerrule = no_anim on, match:namespace selection
