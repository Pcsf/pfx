# pfx default input configuration.
#
# SYSTEM FILE — replaced on every update. Override in ~/.config/hypr/input.conf.
# The keyboard layout is the single most likely thing you need to change; set
# kb_layout there rather than here.

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# Three-finger horizontal swipe changes workspace. Hyprland 0.51+ replaced the
# old `gestures { workspace_swipe = true }` block with this form.
gesture = 3, horizontal, workspace

cursor {
    hide_on_key_press = true
}
