# pfx system monitor.
#
# YOUR FILE — backed up before replacement, never silently overwritten.
# color_theme points at the active pfx theme; pfx-theme-set repoints it.

color_theme = "@HOME@/.config/pfx/current/theme/btop.theme"
theme_background = False
truecolor = True
vim_keys = True
update_ms = 1000
proc_sorting = "cpu lazy"
proc_tree = False
show_battery = True
