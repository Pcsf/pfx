# pfx — Hyprland entry point.
#
# YOUR FILE. The installer will back this up before replacing it, and never
# overwrites it silently. Order matters: system defaults load first, your
# overrides load second, so yours always win.
#
# Reference: https://wiki.hypr.land/Configuring/

# --- System defaults (do not edit these files; they are replaced on update) ---
source = ~/.local/share/pfx/default/hypr/envs.conf
source = ~/.local/share/pfx/default/hypr/looknfeel.conf
source = ~/.local/share/pfx/default/hypr/input.conf
source = ~/.local/share/pfx/default/hypr/windows.conf
source = ~/.local/share/pfx/default/hypr/bindings.conf
source = ~/.local/share/pfx/default/hypr/autostart.conf

# --- Active theme (colours only) ---
source = ~/.config/pfx/current/theme/hyprland.conf

# --- Your overrides (these win) ---
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/autostart.conf
