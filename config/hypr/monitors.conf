# Your displays.
#
# The default auto-detects everything, which is right for a single screen.
# List monitors with:  hyprctl monitors
#
# Format: monitor = NAME, RESOLUTION@RATE, POSITION, SCALE
#
#   monitor = eDP-1, 2560x1600@120, 0x0, 1.6
#   monitor = DP-3, 3840x2160@60, 2560x0, 1.5
#   monitor = , preferred, auto, 1          # everything else, auto

monitor = , preferred, auto, auto
